# Pre: the practice stack served from this machine, shared with the people we
# choose through Tailscale (nothing is public). Run it through
# deploy/deploy.sh, which builds it from main in a separate worktree.
# Docs: docs/technical/deployment.md.
#
# Reachable:
#   PUBLIC_URL                     everything: SPA at /, API at /practice-api,
#                                  Keycloak at /idp (Caddy, service "web")
#   http://localhost:WEB_PORT      the same, from this machine only
#   http://localhost:KEYCLOAK_ADMIN_PORT/idp/admin   Keycloak's admin console
# Sign-in only works on PUBLIC_URL (tokens and redirects use it).
name: shodoukan-pre

x-restart: &restart
  restart: unless-stopped

# The practice API's environment, shared with the migrations.
x-practice-api-env: &practice-api-env
  PRACTICE_DATABASE_URL: postgresql+psycopg://${PRACTICE_DB_USER:?}:${PRACTICE_DB_PASSWORD:?}@practice-db:5432/${PRACTICE_DB_NAME:?}
  # Tokens carry the public issuer; their keys are fetched inside the
  # Docker network instead of going out through the public URL.
  AUTH_ISSUER: ${PUBLIC_URL:?}/idp/realms/shodoukan
  AUTH_AUDIENCE: shodoukan-practice
  AUTH_JWKS_URL: http://keycloak:8080/idp/realms/shodoukan/protocol/openid-connect/certs
  AUTH_SWAGGER_CLIENT_ID: shodoukan-practice-docs
  CORS_ORIGINS: ${PUBLIC_URL:?}
  UVICORN_ROOT_PATH: /practice-api

# Nightly dumps, 7 daily and 4 weekly, one volume per database.
x-backup-env: &backup-env
  SCHEDULE: "@daily"
  BACKUP_KEEP_DAYS: 7
  BACKUP_KEEP_WEEKS: 4
  BACKUP_KEEP_MONTHS: 0

services:
  # Caddy: the SPA's static files, plus /practice-api and /idp proxied.
  web:
    <<: *restart
    image: shodoukan-pre/practice-web:${TAG:-local}
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    environment:
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:?set PUBLIC_SCHEME (http or https)}
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      practice-api:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m

  practice-api:
    <<: *restart
    image: shodoukan-pre/practice-api:${TAG:-local}
    build:
      context: ..
      dockerfile: packages/shodoukan-practice/Dockerfile
      args:
        DICT_RELEASE: ${DICT_RELEASE:-latest}
    environment: *practice-api-env
    depends_on:
      practice-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m

  # One-shot: brings the schema up to date before the API starts.
  practice-migrate:
    image: shodoukan-pre/practice-api:${TAG:-local}
    command: ["alembic", "-c", "packages/shodoukan-practice/alembic.ini", "upgrade", "head"]
    environment: *practice-api-env
    depends_on:
      practice-db:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  practice-db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PRACTICE_DB_USER:?}
      POSTGRES_PASSWORD: ${PRACTICE_DB_PASSWORD:?}
      POSTGRES_DB: ${PRACTICE_DB_NAME:?}
    volumes:
      - practice-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  keycloak:
    <<: *restart
    image: shodoukan-pre/keycloak:${TAG:-local}
    build:
      context: ..
      dockerfile: docker/keycloak/Dockerfile
    environment:
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Public URL (tokens' issuer, login pages) and a separate admin URL that
      # only exists on localhost; Caddy hides the admin console publicly.
      KC_HOSTNAME: ${PUBLIC_URL:?}/idp
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:?}/idp
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Filled into the realm's redirect URIs on its first import.
      PUBLIC_URL: ${PUBLIC_URL:?}
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:?}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl: talk HTTP to the management port directly.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # The JVM sizes its heap from this limit (70% by default).
    mem_limit: 768m

  # One-shot, after Keycloak is up: invite-only realm, client URLs from
  # PUBLIC_URL, admin sign-in on localhost (docker/keycloak/setup.sh).
  keycloak-setup:
    image: shodoukan-pre/keycloak:${TAG:-local}
    entrypoint: ["/opt/keycloak/bin/shodoukan-setup.sh"]
    environment:
      ADMIN_USER: ${KEYCLOAK_ADMIN_USER:?}
      ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      ADMIN_URL: http://localhost:${KEYCLOAK_ADMIN_PORT:?}/idp
      PUBLIC_URL: ${PUBLIC_URL:?}
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  keycloak-db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  practice-db-backup:
    <<: *restart
    image: prodrigestivill/postgres-backup-local:16
    environment:
      <<: *backup-env
      POSTGRES_HOST: practice-db
      POSTGRES_DB: ${PRACTICE_DB_NAME:?}
      POSTGRES_USER: ${PRACTICE_DB_USER:?}
      POSTGRES_PASSWORD: ${PRACTICE_DB_PASSWORD:?}
    volumes:
      - practice-backups:/backups
    depends_on:
      practice-db:
        condition: service_healthy
    mem_limit: 64m

  keycloak-db-backup:
    <<: *restart
    image: prodrigestivill/postgres-backup-local:16
    environment:
      <<: *backup-env
      POSTGRES_HOST: keycloak-db
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - keycloak-backups:/backups
    depends_on:
      keycloak-db:
        condition: service_healthy
    mem_limit: 64m

  # The tunnel: serves web over HTTPS on the tailnet as
  # https://shodoukan.<tailnet>.ts.net, reachable only by our devices and the
  # people the node is shared with (no Funnel: nothing is public). It's its
  # own node, so sharing it exposes nothing else of this machine. Enabled
  # with COMPOSE_PROFILES=tunnel.
  tailscale:
    <<: *restart
    profiles: [tunnel]
    image: tailscale/tailscale:stable
    hostname: shodoukan
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}  # only needed for the first login
      TS_HOSTNAME: shodoukan
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - web
    mem_limit: 128m

volumes:
  practice-db-data:
  keycloak-db-data:
  practice-backups:
  keycloak-backups:
  tailscale-state:
