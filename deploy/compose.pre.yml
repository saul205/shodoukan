# Pre: the production stack on this machine, built from the working tree,
# with its own databases (never the dev ones). Run it through deploy/pre.sh.
name: shodoukan-pre

services:
  web:
    image: shodoukan-pre/practice-web:local
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"

  practice-api:
    image: shodoukan-pre/practice-api:local
    build:
      context: ..
      dockerfile: packages/shodoukan-practice/Dockerfile

  practice-migrate:
    image: shodoukan-pre/practice-api:local

  keycloak:
    image: shodoukan-pre/keycloak:local
    build:
      context: ..
      dockerfile: docker/keycloak/Dockerfile
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT}:8080"

  keycloak-setup:
    image: shodoukan-pre/keycloak:local
