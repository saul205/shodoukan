[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shodoukan"
version = "0.1.0"
description = "Japanese-English dictionary library"
readme = "../../README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
shodoukan-setup = "shodoukan.cli:setup"

[tool.hatch.build.targets.wheel]
packages = ["src/shodoukan"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["../../tests/shodoukan"]
