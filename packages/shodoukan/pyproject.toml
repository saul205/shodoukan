[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shodoukan"
version = "0.1.0"
description = "Japanese-English dictionary library"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
shodoukan-setup = "shodoukan.cli:setup"
shodoukan = "shodoukan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shodoukan"]

[tool.pytest.ini_options]
testpaths = ["../../tests/shodoukan"]
