[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shodoukan-api"
version = "0.2.0"
description = "Japanese-English dictionary web API"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "shodoukan>=0.2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
shodoukan-api = "shodoukan_api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/shodoukan_api"]

[tool.pytest.ini_options]
testpaths = ["../../tests/shodoukan-api"]
