services:
  api:
    build:
      context: .
      dockerfile: packages/shodoukan-api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.dev
    restart: unless-stopped

  # PostgreSQL for shodoukan-practice. Credentials come from .env.dev
  # (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB, see .env.example).
  practice-db:
    image: postgres:16-alpine
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:${PRACTICE_DB_PORT:-5432}:5432"
    volumes:
      - practice-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  practice-db-data:
