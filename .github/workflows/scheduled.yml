name: Scheduled

# Housekeeping for the dictionary on Render (docs/technical/deployment.md).
# GitHub pauses scheduled workflows after 60 days without repository
# activity; re-enable this one from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"  # keep-alive
    - cron: "0 6 2 * *"     # monthly dictionary refresh
  workflow_dispatch:

jobs:
  # The free Render instance sleeps after 15 minutes without traffic; one
  # always-on service fits in the free 750 instance hours a month.
  keep-alive:
    if: github.event.schedule != '0 6 2 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping the dictionary API
        env:
          API_URL: ${{ vars.DICT_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Set the DICT_API_URL repository variable to enable the ping."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$API_URL/health"

  # Rebuilding the API image downloads the latest shodoukan-db release.
  # (The practice stack picks it up on its next deploy/deploy.sh.)
  refresh-dictionary:
    if: github.event.schedule == '0 6 2 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy the dictionary API
        run: curl -fsS -X POST "${{ secrets.RENDER_HOOK_DICT_API }}"
