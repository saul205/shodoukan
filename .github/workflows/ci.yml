name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # Throwaway database, only reachable from this job.
    services:
      practice-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shodoukan_practice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shodoukan_practice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e "packages/shodoukan[dev]" \
                      -e "packages/shodoukan-api[dev]" \
                      -e "packages/shodoukan-practice[dev]"

      - name: Type check
        run: mypy

      - name: Test library
        run: pytest tests/shodoukan

      - name: Test API
        run: pytest tests/shodoukan-api

      - name: Test practice
        run: pytest tests/shodoukan-practice

      - name: Migrate practice database (PostgreSQL)
        env:
          PRACTICE_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/shodoukan_practice
        run: |
          alembic -c packages/shodoukan-practice/alembic.ini upgrade head
          alembic -c packages/shodoukan-practice/alembic.ini check
          alembic -c packages/shodoukan-practice/alembic.ini downgrade base
          alembic -c packages/shodoukan-practice/alembic.ini upgrade head

  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        # El comando curl "llama" a Render para que empiece el build
        run: |
          curl -f "${{ secrets.DEPLOY_HOOK }}"
