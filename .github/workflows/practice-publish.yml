name: Publish practice images

# Builds the practice stack's images and pushes them to GHCR, tagged with the
# commit SHA and `latest`. Nothing runs on the host: deploy there by hand with
# deploy/deploy.sh (or deploy/deploy.sh <sha> to roll back).
# See docs/technical/deployment.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Monthly rebuild so the baked-in dictionary picks up the latest
  # shodoukan-db release (published at the start of each month).
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    # After CI only when it passed on a push to main.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: shodoukan-practice-api
            dockerfile: packages/shodoukan-practice/Dockerfile
          - image: shodoukan-practice-web
            dockerfile: deploy/web/Dockerfile
          - image: shodoukan-keycloak
            dockerfile: docker/keycloak/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run runs on the default branch: build the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.sha.outputs.short }}
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
