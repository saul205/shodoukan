line-length = 88
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # Depends() in FastAPI route defaults is idiomatic
]

[lint.isort]
known-first-party = ["shodoukan", "shodoukan_api"]

[format]
quote-style = "double"
indent-style = "space"
