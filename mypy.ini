[mypy]
python_version = 3.11
plugins = pydantic.mypy
mypy_path = packages/shodoukan/src:packages/shodoukan-api/src:packages/shodoukan-practice/src
explicit_package_bases = True
files = packages/shodoukan-practice/src, tests/shodoukan-practice
warn_unused_configs = True

# Strict only for the practice package; the core library and API predate mypy
# and are checked with the defaults when opened in the editor.
[mypy-shodoukan_practice.*]
strict = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
